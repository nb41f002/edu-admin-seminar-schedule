<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>葉容辰｜教育法令：校事會議</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font-family:system-ui,sans-serif}header,nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:12px}a{color:#ddd}button,select{font:inherit;padding:10px 14px;background:#252525;color:white;border:1px solid #666;border-radius:6px;cursor:pointer}button:disabled{opacity:.4}main{max-width:1600px;margin:auto}main:fullscreen{overflow:auto;max-width:none;background:#101010}.stage{position:relative;aspect-ratio:16/9;background:black}.stage>img{width:100%;height:100%;display:block}.stage video,.stage>a{position:absolute}.stage video{object-fit:contain;background:black}.help{text-align:center;color:#bbb;padding:0 16px;font-size:14px}.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;padding:12px;z-index:5}.top svg{width:22px;height:22px}@media(max-width:600px){header{font-size:14px}.stage{min-width:0}nav{gap:6px}button,select{font-size:14px;padding:10px}.help{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style>
<header><strong>教育法令：校事會議｜葉容辰</strong><a href="../">課程網站</a></header>
<main><div class="stage" id="stage" aria-label="簡報頁面"></div><nav aria-label="簡報導覽"><button id="prev">上一頁</button><label>頁次 <select id="page" aria-label="選擇頁次"></select></label><button id="next">下一頁</button><button id="full">全螢幕</button></nav><p class="help">共45頁。第7、23頁可點按影片播放，亦可使用影片控制列放大觀看。鍵盤方向鍵可切換頁面。</p><p class="help" id="status" role="status"></p></main>
<button class="top" id="top" aria-label="回到最上面" title="回到最上面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 14 7-7 7 7M12 7v14"/></svg></button>
<script>
'use strict';let manifest,page=1;const stage=document.querySelector('#stage'),select=document.querySelector('#page');
function show(n){stage.querySelectorAll('video').forEach(v=>v.pause());page=Math.max(1,Math.min(manifest.slides.length,n));stage.replaceChildren();const img=new Image();img.src=`pages/${page}.jpg`;img.alt=`教育法令：校事會議，第${page}頁`;stage.append(img);const row=manifest.slides[page-1];function place(el,b){Object.assign(el.style,{left:`${b.x/manifest.width*100}%`,top:`${b.y/manifest.height*100}%`,width:`${b.w/manifest.width*100}%`,height:`${b.h/manifest.height*100}%`});}for(const b of row.videos){const v=document.createElement('video');v.src=`video${page}.mp4`;v.controls=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-label',`第${page}頁引用影片`);v.addEventListener('error',()=>document.querySelector('#status').textContent='影片載入失敗，請重新整理後再試。');place(v,b);stage.append(v);}for(const b of row.links){const a=document.createElement('a');a.href=b.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','開啟本頁參考連結');place(a,b);stage.append(a);}select.value=page;document.querySelector('#prev').disabled=page===1;document.querySelector('#next').disabled=page===manifest.slides.length;document.querySelector('#status').textContent=`第${page}／${manifest.slides.length}頁`;history.replaceState(null,'',`#${page}`);}
document.querySelector('#prev').onclick=()=>show(page-1);document.querySelector('#next').onclick=()=>show(page+1);select.onchange=()=>show(Number(select.value));document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.querySelector('main').requestFullscreen)await document.querySelector('main').requestFullscreen();else document.querySelector('#status').textContent='此瀏覽器請使用影片控制列的全螢幕按鈕。';}catch{document.querySelector('#status').textContent='請使用瀏覽器或影片控制列的全螢幕功能。';}};document.querySelector('#top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.addEventListener('keydown',e=>{if(!manifest||['SELECT','INPUT','VIDEO'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(page+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(page-1);}});
fetch('manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{manifest=m;for(let i=1;i<=m.slides.length;i++)select.add(new Option(`${i}／${m.slides.length}`,i));show(Number(location.hash.slice(1))||1)}).catch(()=>document.querySelector('#status').textContent='頁面資料載入失敗，請重新整理。');
</script></html>
